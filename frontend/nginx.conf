# SPA hosting: deep links (/projects/:id, /google/callback, /assistant) must
# fall back to index.html so BrowserRouter can route client-side.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (UAT baseline; tightened further in P4.5).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Hashed Vite assets: immutable, cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: SPA fallback, never cached (index.html must stay fresh
    # so VITE_API_URL pointing at the backend never goes stale).
    location / {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Container health probe target (Cloud Run default is TCP; keep HTTP too).
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
